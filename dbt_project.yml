name: 'my_new_project'
version: '1.0.0'
config-version: 2

# This setting configures which profile dbt uses for this project.
profile: 'default'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Build artifacts
target-path: "target"

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  my_new_project:

    # Bronze layer
    bronze:
      +materialized: view
      +schema: bronze

    # Silver layer
    silver:
      +materialized: view
      +schema: silver

    # Gold layer
    gold:
      +materialized: view
      +schema: gold
      